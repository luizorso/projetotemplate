<!DOCTYPE html>

<html xmlns:th="http://thymeleaf.org">
    <head>
        <title>listarPerfis</title>
        <meta charset="UTF-8">
        <meta name="viewport" 
              content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/styleListar.css}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <!-- Css da Navbar -->
        <link rel="stylesheet" th:href="@{/navbar.css}">
    </head>
    <body>
        <!-- Importação do menu Navbar -->
        <div th:replace="~{fragments/navbar :: menu}"></div>
        <div class="main-container">
            <div class="container">
                <div th:if="${mensagem}" style="color: green;
                     font-weight: bold">
                    <p th:text="${mensagem}"></p>
                </div>
                <div class="header-actions">
                    <h3>Listagem de Perfis</h3>
                    <a th:href="@{/perfis/novo}"
                       class="btn-primary">Novo Perfil
                    </a>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nome</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="perfil : ${perfis}"
                                th:if="${perfil != null}">
                                <!-- CÓDIGO COM TOOLTIP E ABREVIAÇÃO -->
                                <td class="col-codigo" 
                                    th:title="${perfil.id}" 
                                    th:text="${perfil.id != null ? #strings.substring(perfil.id, 0, 8) + '...' : ''}">
                                </td>
                                <td th:text="${perfil?.nome}"></td>
                                <td class="col-acoes text-end">
                                    <!-- Contêiner flexível para alinhar os botões lado a lado sem quebra -->
                                    <div class="actions-cell">
                                        <!-- Editar -->
                                        <a th:href="@{/perfis/editar/{id}(id=${perfil.id})}" 
                                           class="btn-action edit" 
                                           title="Editar Perfil">
                                            <i class="bi bi-pencil-square"></i> Editar
                                        </a>

                                        <!-- Excluir (Formulário inline) -->
                                        <form th:action="@{/perfis/excluir/{id}(id=${perfil.id})}"
                                              method="post" 
                                              class="form-delete">
                                            <button type="submit" 
                                                    class="btn-action delete" 
                                                    title="Excluir Perfil"
                                                    onclick="return confirm('Tem certeza que deseja excluir este perfil?');">
                                                <i class="bi bi-trash"></i> Excluir
                                            </button>
                                        </form>
                                    </div>
                                </td>

                            </tr>
                            <tr th:if="${#lists.isEmpty(produtos)}">
                                <td colspan="3" class="empty-mesagem">Nenhum Produto cadastrado!</td>
                            </tr>
                        </tbody>
                    </table>


                </div>



            </div><!- fecha da div container -->
        </div><!-- fecha da div main-container -->
    </body>
</html>

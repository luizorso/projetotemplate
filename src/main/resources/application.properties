spring.application.name=projetotemplate

# Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5432/projetotemplate?useSSL=false&serverTimezone=UTC

# URL de conexão JDBC com o PostgreSQL:
# - localhost:5432 -> Servidor e porta onde o PostgreSQL está rodando
# - /projetotemplate -> Nome do banco de dados a ser acessado
# - ?useSSL=false -> Desativa a exigência de conexão SSL (comum em dev)
# - &serverTimezone=UTC -> Define o fuso horário para evitar divergências de data/hora 

# Nome do usuário administrador do PostgreSQL
spring.datasource.username=postgres

# Senha do usuário do PostgreSQL
spring.datasource.password=postgres

# Define a classe do driver JDBC usada pelo Spring para se comunicar com o PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Habilita a geração automática de DDL (Data Definition Language) 
#pelo Spring JPA
spring.jpa.generate-ddl=true
# Estratégia de gerenciamento de tabelas do Hibernate:
# 'update' -> Cria novas tabelas e atualiza colunas de entidades @Entity 
#sem apagar os dados existente
spring.jpa.hibernate.ddl-auto=update

# Exibe os comandos SQL gerados no console (ótimo para conferir 
# a criação de tabelas e INSERTs)
# Exibe as consultas SQL geradas pelo Hibernate diretamente no console do NetBeans
spring.jpa.show-sql=true

# Formata o SQL exibido no console para facilitar a leitura 
#(com quebras de linha e recuos)
spring.jpa.properties.hibernate.format_sql=true

# Esquema padrão
spring.jpa.properties.hibernate.default_schema=public

# Garante a atualização imediata de recursos estáticos (CSS/JS)
spring.web.resources.static-locations=classpath:/static/

# Desativa o cache do Thymeleaf (HTMLs atualizam com F5)
spring.thymeleaf.cache=false

# Desativa cache de arquivos estáticos (CSS e JS)
spring.web.resources.cache.period=0



